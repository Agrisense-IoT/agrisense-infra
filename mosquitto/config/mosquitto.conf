# =============================================================================
# Mosquitto MQTT broker — Agrisense
# =============================================================================

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Plain MQTT listener (used by field devices and the NestJS API)
listener 1883
protocol mqtt

# WebSocket listener (useful for browser-based dashboards / debugging tools)
listener 9001
protocol websockets

# Authentication
# Set to false to require username/password (configure password_file below).
# For a trusted LAN deployment, anonymous access is acceptable.
allow_anonymous true

# Uncomment and populate to enable username/password auth:
# allow_anonymous false
# password_file /mosquitto/config/passwd
