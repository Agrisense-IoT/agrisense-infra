name: Build TUI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build TUI
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: tui/go.sum

      - name: Build TUI
        working-directory: tui
        run: make build-all

      - name: Upload Mac Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: agrisense-mac
          path: "tui/dist/agrisense-mac"

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: agrisense-linux
          path: "tui/dist/agrisense-linux"

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: agrisense-windows
          path: "tui/dist/agrisense-windows.exe"

      - name: Create/Update Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          gh release delete latest --yes || true
          git tag -d latest || true
          git tag latest
          git push origin latest --force
          gh release create latest \
            --title "Latest Binaries" \
            --notes "Experimental builds of Agrisense TUI (including Mac Universal binary)." \
            "tui/dist/agrisense-mac" \
            "tui/dist/agrisense-linux" \
            "tui/dist/agrisense-windows.exe"
