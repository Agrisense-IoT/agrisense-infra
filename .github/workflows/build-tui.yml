name: Build TUI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build TUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: tui/go.sum

      - name: Build TUI
        working-directory: tui
        run: make build-all

      - name: Upload Silicon Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: Agrisense (Silicon Mac)
          path: "tui/dist/Agrisense (Silicon Mac)"

      - name: Upload Intel Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: Agrisense (Intel Mac)
          path: "tui/dist/Agrisense (Intel Mac)"

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: Agrisense (Linux x64)
          path: "tui/dist/Agrisense (Linux x64)"

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: Agrisense (Windows).exe
          path: "tui/dist/Agrisense (Windows).exe"
